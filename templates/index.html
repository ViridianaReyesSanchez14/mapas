<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ruta Preciso</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #app {
            display: flex;
            height: 100%;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        #sidebar {
            width: 400px;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .header {
            color: var(--primary);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--dark);
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus {
            border-color: var(--secondary);
            outline: none;
        }
        .waypoint-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .waypoint-item input {
            flex: 1;
        }
        .remove-waypoint {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 0 12px;
            cursor: pointer;
        }
        .transport-options {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .transport-option {
            flex: 1;
            text-align: center;
            padding: 15px 5px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .transport-option:hover {
            border-color: var(--secondary);
        }
        .transport-option.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        .transport-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .options {
            margin: 20px 0;
        }
        .checkbox-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .checkbox-option input {
            width: auto;
            margin-right: 10px;
        }
        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: #2980b9;
        }
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .results {
            margin-top: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .route-summary {
            background: var(--light);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .route-summary h3 {
            margin-top: 0;
            color: var(--primary);
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .summary-label {
            font-weight: 600;
        }
        .directions {
            margin-top: 20px;
        }
        .direction-step {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .error-box {
            background: #fee;
            border-left: 4px solid var(--danger);
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: var(--danger);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .timestamp {
            font-size: 12px;
            color: #7f8c8d;
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="map"></div>
        
        <div id="sidebar">
            <div class="header">
                <h1><i class="fas fa-route"></i> Ruta Precisión MX</h1>
                <p>Sistema de cálculo de rutas con datos reales</p>
            </div>
            
            <div class="input-group">
                <label for="origin">Origen:</label>
                <input id="origin" placeholder="Ej: 19.4326,-99.1332 o 'El Deni'">
            </div>
            
            <div class="input-group">
                <label for="destination">Destino:</label>
                <input id="destination" placeholder="Ej: 16.8531,-99.8237 o 'Acapulco'">
            </div>
            
            <div class="input-group">
                <label>Puntos Intermedios:</label>
                <div id="waypoints-container"></div>
                <button id="add-waypoint" class="btn" style="background: #7f8c8d;">
                    <i class="fas fa-plus"></i> Agregar punto
                </button>
            </div>
            
            <div class="transport-options">
                <div class="transport-option active" data-mode="automovil" onclick="selectTransport(this)">
                    <div class="transport-icon"><i class="fas fa-car"></i></div>
                    <div>Automóvil</div>
                </div>
                <div class="transport-option" data-mode="motocicleta" onclick="selectTransport(this)">
                    <div class="transport-icon"><i class="fas fa-motorcycle"></i></div>
                    <div>Motocicleta</div>
                </div>
                <div class="transport-option" data-mode="caminando" onclick="selectTransport(this)">
                    <div class="transport-icon"><i class="fas fa-walking"></i></div>
                    <div>Caminando</div>
                </div>
            </div>
            
            <div class="options">
                <div class="checkbox-option">
                    <input type="checkbox" id="avoid-tolls">
                    <label for="avoid-tolls">Evitar casetas de peaje</label>
                </div>
            </div>
            
            <button id="calculate-btn" class="btn" onclick="calculateRoute()">
                <i class="fas fa-calculator"></i> Calcular Ruta
            </button>
            
            <div id="error-container" class="error-box" style="display: none;">
                <h3><i class="fas fa-exclamation-triangle"></i> Error</h3>
                <p id="error-message"></p>
            </div>
            
            <div id="results" class="results"></div>
        </div>
    </div>

    <script>
        // Variables globales
        let map;
        let routeLayer;
        let markers = [];
        let selectedMode = 'automovil';
        
        // Inicialización del mapa
        function initMap() {
            map = L.map('map').setView([19.4326, -99.1332], 6);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            
            // Agregar primer waypoint por defecto
            addWaypoint();
        }
        
        // Manejo de waypoints
        function addWaypoint() {
            const container = document.getElementById('waypoints-container');
            const waypointDiv = document.createElement('div');
            waypointDiv.className = 'waypoint-item';
            waypointDiv.innerHTML = `
                <input type="text" class="waypoint-input" placeholder="Coordenadas o dirección">
                <button class="remove-waypoint" onclick="removeWaypoint(this)">
                    <i class="fas fa-times"></i>
                </button>
            `;
            container.appendChild(waypointDiv);
        }
        
        function removeWaypoint(button) {
            button.parentElement.remove();
        }
        
        function getWaypoints() {
            const inputs = document.querySelectorAll('.waypoint-input');
            return Array.from(inputs).map(input => input.value.trim()).filter(Boolean);
        }
        
        // Selección de modo de transporte
        function selectTransport(element) {
            document.querySelectorAll('.transport-option').forEach(el => {
                el.classList.remove('active');
            });
            element.classList.add('active');
            selectedMode = element.dataset.mode;
        }
        
        // Cálculo de ruta
        async function calculateRoute() {
            const origin = document.getElementById('origin').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const waypoints = getWaypoints();
            const avoidTolls = document.getElementById('avoid-tolls').checked;
            
            // Validación básica
            if (!origin || !destination) {
                showError('Debes especificar origen y destino');
                return;
            }
            
            // Mostrar estado de carga
            const btn = document.getElementById('calculate-btn');
            btn.innerHTML = '<span class="loading"></span> Calculando...';
            btn.disabled = true;
            
            // Limpiar resultados anteriores
            document.getElementById('error-container').style.display = 'none';
            document.getElementById('results').innerHTML = '';
            clearMap();
            
            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origin: origin,
                        destination: destination,
                        waypoints: waypoints,
                        vehicle: selectedMode,  // Modificado para coincidir con tu API
                        avoid_tolls: avoidTolls
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Error al calcular la ruta');
                }
                
                displayResults(data);
                drawRoute(data);
                
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            } finally {
                btn.innerHTML = '<i class="fas fa-calculator"></i> Calcular Ruta';
                btn.disabled = false;
            }
        }
        
        // Mostrar resultados
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            let fuelHtml = '';
            if (selectedMode !== 'caminando') {
                fuelHtml = `
                    <div class="summary-item">
                        <span class="summary-label">Combustible usado:</span>
                        <span>${data.fuel_used} litros (${selectedMode === 'automovil' ? 'Gasolina' : 'Gasolina'})</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Costo estimado:</span>
                        <span>$${data.fuel_cost} MXN</span>
                    </div>
                `;
            }
            
            let tollHtml = '';
            if (selectedMode !== 'caminando' && data.toll_distance > 0) {
                tollHtml = `
                    <div class="summary-item">
                        <span class="summary-label">Distancia en casetas:</span>
                        <span>${data.toll_distance} km</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Costo de peajes:</span>
                        <span>$${data.toll_cost} MXN</span>
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = `
                <div class="route-summary">
                    <h3><i class="fas fa-info-circle"></i> Resumen de Ruta</h3>
                    <div class="summary-item">
                        <span class="summary-label">Distancia:</span>
                        <span>${data.distance} km</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Tiempo estimado:</span>
                        <span>${Math.floor(data.time / 60)}h ${Math.round(data.time % 60)}min</span>
                    </div>
                    ${fuelHtml}
                    ${tollHtml}
                    <div class="timestamp">
                        <i class="fas fa-sync-alt"></i> Actualizado: ${data.timestamp}
                    </div>
                </div>
                
                <div class="directions">
                    <h3><i class="fas fa-map-signs"></i> Indicaciones</h3>
                    ${data.directions.map((step, i) => `
                        <div class="direction-step">
                            <strong>${i + 1}.</strong> ${step.replace(/<[^>]*>/g, '')}
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // Dibujar ruta en el mapa (FUNCIÓN COMPLETAMENTE ACTUALIZADA)
        function drawRoute(data) {
            // Limpiar mapa
            clearMap();
            
            // Convertir geometría a coordenadas
            let latLngs = [];
            if (Array.isArray(data.geometry)) {
                for (let i = 0; i < data.geometry.length; i += 2) {
                    latLngs.push([data.geometry[i], data.geometry[i + 1]]);
                }
            }
            
            // Dibujar ruta
            if (latLngs.length > 0) {
                routeLayer = L.polyline(latLngs, {
                    color: '#3498db',
                    weight: 5,
                    opacity: 0.7
                }).addTo(map);
                
                // Agregar marcadores personalizados para inicio y fin
                if (data.start_coords && data.end_coords) {
                    // Marcador de inicio (verde)
                    const startIcon = L.divIcon({
                        className: 'start-marker',
                        html: '<i class="fas fa-map-marker-alt" style="color: #27ae60; font-size: 24px;"></i>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 24]
                    });
                    
                    const startMarker = L.marker(
                        [data.start_coords[0], data.start_coords[1]], 
                        {icon: startIcon}
                    ).addTo(map)
                    .bindTooltip("Punto de inicio", {permanent: false, direction: 'top'});
                    markers.push(startMarker);

                    // Marcador de destino (rojo)
                    const endIcon = L.divIcon({
                        className: 'end-marker',
                        html: '<i class="fas fa-map-marker-alt" style="color: #e74c3c; font-size: 24px;"></i>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 24]
                    });
                    
                    const endMarker = L.marker(
                        [data.end_coords[0], data.end_coords[1]], 
                        {icon: endIcon}
                    ).addTo(map)
                    .bindTooltip("Punto de destino", {permanent: false, direction: 'top'});
                    markers.push(endMarker);
                }
                
                // Ajustar vista del mapa
                map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
            }
        }
        
        // Limpiar mapa
        function clearMap() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            
            markers.forEach(marker => {
                map.removeLayer(marker);
            });
            markers = [];
        }
        
        // Mostrar error
        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            document.getElementById('error-message').textContent = message;
            errorContainer.style.display = 'block';
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            
            // Configurar botón para agregar waypoints
            document.getElementById('add-waypoint').addEventListener('click', addWaypoint);
        });
</script>
</body>
</html>
